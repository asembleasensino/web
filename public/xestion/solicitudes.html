<!doctype html>
<html lang="gl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitudes · Xestión AAEP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap");

      :root {
        --ink: #252321;
        --paper: #f2f0ec;
        --paper-raised: #fbfaf8;
        --red: #c94a42;
        --red-bg: rgba(201, 74, 66, 0.1);
        --green: #355a2c;
        --green-bg: rgba(53, 90, 44, 0.1);
        --amber: #a8722a;
        --amber-bg: rgba(184, 134, 46, 0.14);
        --line: rgba(37, 35, 33, 0.14);
        --line-strong: rgba(37, 35, 33, 0.28);
        --shadow: 3px 3px 0 rgba(37, 35, 33, 0.12);
        --font-display: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", sans-serif;
        --font-sans: Inter, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
      }
      .topbar {
        position: sticky; top: 0; z-index: 10;
        background: var(--paper); border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        max-width: 1080px; margin: 0 auto; padding: 18px 20px;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .badge {
        display: grid; place-items: center; width: 34px; height: 34px; border-radius: 4px;
        background: var(--ink); color: var(--paper); font-weight: 800; font-size: 0.7rem; flex-shrink: 0;
      }
      .topbar h1 { font-family: var(--font-display); font-stretch: condensed; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
      .topbar .links { margin-left: auto; display: flex; gap: 16px; align-items: center; font-size: 0.78rem; font-weight: 700; }
      .topbar a { color: var(--ink); }
      .topbar button.link {
        appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink); opacity: 0.55; cursor: pointer;
      }
      .topbar button.link:hover { opacity: 1; text-decoration: underline; }

      .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 90px; }

      .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      .tabs { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
      .tabs button {
        appearance: none; border: 0; background: var(--paper-raised); color: var(--ink);
        padding: 9px 16px; font: inherit; font-weight: 700; font-size: 0.82rem; cursor: pointer;
      }
      .tabs button + button { border-left: 1.5px solid var(--ink); }
      .tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
      .tabs button .count { opacity: 0.65; font-weight: 400; margin-left: 4px; }

      .search {
        flex: 1; min-width: 200px; max-width: 320px;
        border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 9px 12px;
        font: inherit; font-size: 0.85rem; background: var(--paper-raised); color: var(--ink);
      }
      .search:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

      .status-msg { padding: 40px 0; text-align: center; color: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 0.95rem; }
      .status-msg.error { color: var(--red); font-weight: 700; }

      .list { display: grid; gap: 14px; }
      .card {
        background: var(--paper-raised); border: 1px solid var(--line); border-radius: 5px;
        box-shadow: var(--shadow); padding: 18px 20px;
        display: grid; gap: 12px;
      }
      .card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .card-head h2 { margin: 0; font-size: 1.15rem; font-weight: 800; }
      .card-head .codigo { display: block; margin-top: 2px; font-size: 0.72rem; color: color-mix(in srgb, var(--ink) 55%, transparent); font-weight: 600; letter-spacing: 0.02em; }
      .pill {
        font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 4px 10px; border-radius: 999px; white-space: nowrap;
      }
      .pill.pendente_validacion { background: var(--red-bg); color: var(--red); }
      .pill.en_contacto { background: var(--amber-bg); color: var(--amber); }
      .pill.resolta { background: var(--green-bg); color: var(--green); }
      .pill.arquivada { background: rgba(37, 35, 33, 0.08); color: color-mix(in srgb, var(--ink) 60%, transparent); }
      .pill.no-mapa { background: var(--green-bg); color: var(--green); }
      .status-note { margin: 0; font-size: 0.78rem; font-weight: 700; color: color-mix(in srgb, var(--ink) 60%, transparent); }

      .card-meta { font-size: 0.85rem; }
      .card-meta a { color: var(--ink); }
      .card-meta .when { display: block; margin-top: 2px; font-size: 0.72rem; color: color-mix(in srgb, var(--ink) 50%, transparent); }
      .card-msg { font-size: 0.88rem; background: rgba(37, 35, 33, 0.04); border-radius: 4px; padding: 10px 12px; white-space: pre-wrap; }

      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .actions button {
        appearance: none; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
        padding: 7px 13px; font: inherit; font-size: 0.76rem; font-weight: 700; border-radius: 4px; cursor: pointer;
      }
      .actions button:hover { background: var(--ink); color: var(--paper); }
      .actions button:disabled { opacity: 0.4; cursor: default; background: none; color: var(--ink); }
      .actions button.primary { background: var(--ink); color: var(--paper); }
      .actions button.primary:hover { background: var(--red); border-color: var(--red); }
      .actions button.quiet { border-color: var(--line-strong); opacity: 0.7; }
      .actions button.quiet:hover { background: transparent; color: var(--ink); opacity: 1; text-decoration: underline; }

      @media (max-width: 560px) {
        .card-head { flex-direction: column; }
      }
      .xestion-shell { display: flex; align-items: flex-start; min-height: 100vh; }
      .xestion-sidebar { flex: 0 0 220px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--paper-raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; box-sizing: border-box; }
      .xestion-sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; text-decoration: none; }
      .xestion-sidebar-brand .brand-title { font-family: var(--font-display); font-stretch: condensed; font-size: 1.1rem; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
      .xestion-nav { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
      .nav-group-label { margin: 18px 0 6px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: color-mix(in srgb, var(--ink) 50%, transparent); }
      .xestion-nav .nav-group-label:first-child { margin-top: 0; }
      .nav-link { display: block; padding: 8px 10px; border-radius: 4px; font-size: 0.86rem; font-weight: 600; color: var(--ink); text-decoration: none; }
      .nav-link:hover { background: rgba(37, 35, 33, 0.06); }
      .nav-link.current { background: var(--ink); color: var(--paper); font-weight: 700; }
      .xestion-sidebar-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 0.78rem; font-weight: 700; }
      .xestion-sidebar-foot a { color: var(--ink); }
      .xestion-sidebar-foot button.link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink); opacity: 0.55; cursor: pointer; text-align: left; }
      .xestion-sidebar-foot button.link:hover { opacity: 1; text-decoration: underline; }
      .xestion-main { flex: 1 1 auto; min-width: 0; }
      @media (max-width: 760px) {
        .xestion-shell { flex-direction: column; min-height: 0; }
        .xestion-sidebar { position: static; height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
        .xestion-sidebar-brand { margin-bottom: 0; margin-right: auto; }
        .xestion-nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
        .nav-group-label { display: none; }
        .xestion-sidebar-foot { flex-direction: row; margin-top: 0; padding-top: 0; border-top: 0; margin-left: auto; }
      }
    </style>
  </head>
  <body>
    <div class="xestion-shell">
      <aside class="xestion-sidebar">
        <a class="xestion-sidebar-brand" href="/xestion/">
          <span class="badge">AA</span>
          <span class="brand-title">Xestión AAEP</span>
        </a>
        <nav class="xestion-nav">
          <p class="nav-group-label">Xeral</p>
          <a href="/xestion/solicitudes" class="nav-link current">Solicitudes</a>
          <p class="nav-group-label">Coordinación</p>
          <a href="/xestion/coordinacion" class="nav-link">Mapa e territorios</a>
          <a href="/xestion/censo-asembleas" class="nav-link">Censo de asembleas</a>
          <p class="nav-group-label">GdT Comunicación</p>
          <a href="/xestion/stories" class="nav-link">Stories</a>
        </nav>
        <div class="xestion-sidebar-foot">
          <a href="/admin/">CMS (Decap) →</a>
          <button type="button" class="link" id="forget-password">Esquecer contrasinal</button>
        </div>
      </aside>
      <div class="xestion-main">
    <div class="topbar">
      <div class="topbar-inner">
        <span class="badge">AA</span>
        <h1>Solicitudes</h1>
        <div class="links">
          <a href="/admin/#/collections/configuracion/entries/asembleas">Xestionar asembleas →</a>
          <button type="button" class="link" id="forget-github">Esquecer sesión de GitHub</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="controls">
        <div class="tabs" role="tablist" aria-label="Tipo de solicitude">
          <button type="button" role="tab" data-tipo-tab="activacion" aria-selected="true">Activación de centros <span class="count" id="count-tipo-activacion"></span></button>
          <button type="button" role="tab" data-tipo-tab="convocatoria" aria-selected="false">Convocatorias <span class="count" id="count-tipo-convocatoria"></span></button>
        </div>
      </div>
      <div class="controls">
        <div class="tabs" role="tablist" aria-label="Filtrar solicitudes">
          <button type="button" role="tab" data-tab="pendentes" aria-selected="true">Pendentes <span class="count" id="count-pendentes"></span></button>
          <button type="button" role="tab" data-tab="atendidas" aria-selected="false">Atendidas <span class="count" id="count-atendidas"></span></button>
        </div>
        <input type="search" id="search" class="search" placeholder="Buscar…" />
      </div>

      <div id="list"><p class="status-msg">Cargando solicitudes…</p></div>
    </div>

      </div>
    </div>

    <script>
      const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);

      const STATUS_LABEL = {
        pendente_validacion: "Pendente",
        en_contacto: "En contacto",
        resolta: "Resolta",
        arquivada: "Arquivada",
      };
      const PENDING_STATES = ["pendente_validacion", "en_contacto"];
      const DONE_STATES = ["resolta", "arquivada"];

      function xestionAuthHeader() {
        let password = sessionStorage.getItem("aaep-xestion-password");
        if (password === null) {
          password = window.prompt("Contrasinal de xestión:") || "";
          sessionStorage.setItem("aaep-xestion-password", password);
        }
        return "Basic " + btoa(":" + password);
      }

      document.querySelector("#forget-password").addEventListener("click", () => {
        sessionStorage.removeItem("aaep-xestion-password");
        location.reload();
      });

      document.querySelector("#forget-github").addEventListener("click", () => {
        sessionStorage.removeItem("aaep-github-token");
        alert("Esquecida a sesión de GitHub. A próxima vez que deas de alta algo no mapa pedirásela outra vez.");
      });

      let solicitudes = [];
      let activeTab = "pendentes";
      let activeTipo = "activacion";
      let query = "";

      function tipoDe(item) {
        return item.tipo === "convocatoria" ? "convocatoria" : "activacion";
      }

      function actionsFor(item) {
        const buttons = [];
        const esConvocatoria = tipoDe(item) === "convocatoria";
        if (item.estado === "pendente_validacion") {
          buttons.push({ state: "en_contacto", label: "Marcar en revisión", cls: "primary" });
          buttons.push({ state: "arquivada", label: esConvocatoria ? "Rexeitar" : "Arquivar", cls: "quiet" });
        } else if (item.estado === "en_contacto") {
          buttons.push({ state: "resolta", label: esConvocatoria ? "Marcar publicada" : "Marcar resolta", cls: "primary" });
          buttons.push({ state: "arquivada", label: esConvocatoria ? "Rexeitar" : "Arquivar", cls: "quiet" });
        } else if (item.estado === "resolta") {
          if (!esConvocatoria) buttons.push({ action: "mapa", label: "Dar de alta no mapa", cls: "primary" });
          buttons.push({ state: "arquivada", label: esConvocatoria ? "Arquivar" : "Arquivar sen engadir ao mapa", cls: "quiet" });
          buttons.push({ state: "en_contacto", label: "Reabrir", cls: "quiet" });
        } else {
          buttons.push({ state: "pendente_validacion", label: "Reabrir", cls: "quiet" });
        }
        return buttons;
      }

      function matchesQuery(item) {
        if (!query) return true;
        const haystack = tipoDe(item) === "convocatoria"
          ? `${item.titulo} ${item.territorio} ${item.lugar || ""} ${item.nome} ${item.email}`.toLocaleLowerCase()
          : `${item.centro} ${item.centroCodigo} ${item.nome} ${item.email} ${item.telefono || ""}`.toLocaleLowerCase();
        return haystack.includes(query);
      }

      function render() {
        const states = activeTab === "pendentes" ? PENDING_STATES : DONE_STATES;
        const porTipo = solicitudes.filter((item) => tipoDe(item) === activeTipo);
        const visible = porTipo.filter((item) => states.includes(item.estado) && matchesQuery(item));

        document.querySelector("#count-tipo-activacion").textContent =
          `(${solicitudes.filter((item) => tipoDe(item) === "activacion").length})`;
        document.querySelector("#count-tipo-convocatoria").textContent =
          `(${solicitudes.filter((item) => tipoDe(item) === "convocatoria").length})`;
        document.querySelector("#count-pendentes").textContent =
          `(${porTipo.filter((item) => PENDING_STATES.includes(item.estado)).length})`;
        document.querySelector("#count-atendidas").textContent =
          `(${porTipo.filter((item) => DONE_STATES.includes(item.estado)).length})`;

        const list = document.querySelector("#list");
        if (!visible.length) {
          list.innerHTML = `<p class="status-msg">${
            activeTab === "pendentes"
              ? (query ? "Ningunha solicitude pendente coincide coa busca." : "Non hai solicitudes pendentes. ✌️")
              : (query ? "Ningunha solicitude atendida coincide coa busca." : "Aínda non marcaches ningunha coma atendida.")
          }</p>`;
          return;
        }

        list.innerHTML = `<div class="list">${visible.map((item) => {
          const esConvocatoria = tipoDe(item) === "convocatoria";
          const titulo = esConvocatoria ? escapeHtml(item.titulo) : escapeHtml(item.centro);
          const rangoData = item.data
            ? `${new Date(item.data).toLocaleString("gl")}${item.dataFin ? ` – ${new Date(item.dataFin).toLocaleString("gl")}` : ""}`
            : "";
          const subtitulo = esConvocatoria
            ? `${escapeHtml(item.territorio)}${item.lugar ? ` · ${escapeHtml(item.lugar)}` : ""} · ${rangoData}`
            : `Código ${escapeHtml(item.centroCodigo)}`;
          return `
          <article class="card" data-id="${escapeHtml(item.id)}">
            <div class="card-head">
              <div>
                <h2>${titulo}</h2>
                <span class="codigo">${subtitulo}</span>
              </div>
              <span class="pill ${item.estado}">${STATUS_LABEL[item.estado] || item.estado}</span>
              ${item.noMapa ? '<span class="pill no-mapa">No mapa</span>' : ""}
            </div>
            <div class="card-meta">
              ${escapeHtml(item.nome)} · <a href="mailto:${encodeURIComponent(item.email)}">${escapeHtml(item.email)}</a>${item.telefono ? ` · <a href="tel:${encodeURIComponent(item.telefono)}">${escapeHtml(item.telefono)}</a>` : ""}
              <span class="when">Recibida ${new Date(item.createdAt).toLocaleString("gl")}</span>
            </div>
            ${esConvocatoria && item.descricion ? `<div class="card-msg">${escapeHtml(item.descricion)}</div>` : ""}
            ${!esConvocatoria && item.mensaxe ? `<div class="card-msg">${escapeHtml(item.mensaxe)}</div>` : ""}
            <div class="actions">
              ${actionsFor(item).map((btn) => `<button type="button" class="${btn.cls}" ${btn.action ? `data-action="${btn.action}"` : `data-state="${btn.state}"`}>${btn.label}</button>`).join("")}
            </div>
          </article>
        `;
        }).join("")}</div>`;
      }

      document.querySelectorAll("[data-tab]").forEach((tab) => {
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.tab;
          document.querySelectorAll("[data-tab]").forEach((btn) => btn.setAttribute("aria-selected", String(btn === tab)));
          render();
        });
      });

      document.querySelectorAll("[data-tipo-tab]").forEach((tab) => {
        tab.addEventListener("click", () => {
          activeTipo = tab.dataset.tipoTab;
          document.querySelectorAll("[data-tipo-tab]").forEach((btn) => btn.setAttribute("aria-selected", String(btn === tab)));
          render();
        });
      });

      document.querySelector("#search").addEventListener("input", (event) => {
        query = event.target.value.trim().toLocaleLowerCase();
        render();
      });

      // --- Dar de alta no mapa ---------------------------------------
      // Engade o centro a src/data/asembleas.json coma asemblea activa
      // (sen datos de contacto) facendo un commit real en GitHub, para
      // non ter que pasar polo CMS. Reutiliza o mesmo OAuth de GitHub que
      // xa usa o CMS (/api/auth + /api/callback): a primeira vez abre
      // unha xanela de login de GitHub; despois, o token gárdase na
      // sesión do navegador e os commits quedan feitos coma a persoa que
      // iniciou sesión.
      const GITHUB_REPO = "asembleasensino/web";
      const GITHUB_FILE_PATH = "src/data/asembleas.json";

      function base64ToUtf8(base64) {
        const binary = atob(base64.replace(/\n/g, ""));
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder("utf-8").decode(bytes);
      }

      function utf8ToBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      }

      function requestGithubToken() {
        return new Promise((resolve, reject) => {
          const popup = window.open("/api/auth", "github-oauth", "width=600,height=720");
          if (!popup) {
            reject(new Error("O navegador bloqueou a xanela de acceso a GitHub. Permite as xanelas emerxentes e téntao outra vez."));
            return;
          }
          let settled = false;
          const closeCheck = setInterval(() => {
            if (popup.closed && !settled) {
              cleanup();
              reject(new Error("Pechaches a xanela de autorización de GitHub antes de rematar."));
            }
          }, 500);
          function cleanup() {
            window.removeEventListener("message", onMessage);
            clearInterval(closeCheck);
          }
          function onMessage(event) {
            if (event.origin !== window.location.origin || typeof event.data !== "string") return;
            if (event.data === "authorizing:github") {
              // Parte do protocolo de autorización do CMS, que reutilizamos
              // tal cal: confirmamos a recepción para que a xanela emerxente
              // nos envíe o resultado real.
              popup.postMessage(event.data, event.origin);
              return;
            }
            const match = event.data.match(/^authorization:github:(success|error):(.+)$/s);
            if (!match) return;
            settled = true;
            cleanup();
            const [, status, jsonPart] = match;
            if (status === "success") {
              try {
                const { token } = JSON.parse(jsonPart);
                sessionStorage.setItem("aaep-github-token", token);
                resolve(token);
              } catch {
                reject(new Error("Resposta de GitHub inesperada."));
              }
            } else {
              let message = "Autorización de GitHub cancelada ou fallida.";
              try { message = JSON.parse(jsonPart).message || message; } catch {}
              reject(new Error(message));
            }
          }
          window.addEventListener("message", onMessage);
        });
      }

      function ensureGithubToken() {
        const stored = sessionStorage.getItem("aaep-github-token");
        return stored ? Promise.resolve(stored) : requestGithubToken();
      }

      async function githubRequest(path, token, options = {}) {
        return fetch(`https://api.github.com/repos/${GITHUB_REPO}${path}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {}),
          },
        });
      }

      async function engadirCentroAoMapa(centro) {
        let token = await ensureGithubToken();

        async function tentar(retried) {
          let getResponse = await githubRequest(`/contents/${GITHUB_FILE_PATH}`, token);
          if (getResponse.status === 401 && !retried) {
            sessionStorage.removeItem("aaep-github-token");
            token = await requestGithubToken();
            return tentar(true);
          }
          if (!getResponse.ok) throw new Error(`GitHub respondeu ${getResponse.status} ao ler o ficheiro.`);
          const fileData = await getResponse.json();
          const current = JSON.parse(base64ToUtf8(fileData.content));
          const list = current.asembleas || [];
          const index = list.findIndex((entry) => entry.codigo === centro.codigo);
          if (index >= 0) {
            list[index] = { ...list[index], nome: centro.nome, concello: centro.concello, estado: "activa" };
          } else {
            list.push({ codigo: centro.codigo, nome: centro.nome, concello: centro.concello, estado: "activa" });
          }
          current.asembleas = list;

          const putResponse = await githubRequest(`/contents/${GITHUB_FILE_PATH}`, token, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              message: `Dar de alta no mapa: ${centro.nome} (${centro.codigo})`,
              content: utf8ToBase64(JSON.stringify(current, null, 2) + "\n"),
              sha: fileData.sha,
              branch: "main",
            }),
          });
          if (putResponse.status === 401 && !retried) {
            sessionStorage.removeItem("aaep-github-token");
            token = await requestGithubToken();
            return tentar(true);
          }
          if (putResponse.status === 409 && !retried) {
            // Alguén editou o ficheiro á vez: volvemos ler e tentalo unha vez máis.
            return tentar(true);
          }
          if (!putResponse.ok) {
            const body = await putResponse.json().catch(() => ({}));
            throw new Error(body.message || `GitHub respondeu ${putResponse.status} ao gardar.`);
          }
        }

        await tentar(false);
      }

      async function patchSolicitude(id, extra) {
        const response = await fetch("/api/solicitudes", {
          method: "PATCH",
          headers: { "content-type": "application/json", Authorization: xestionAuthHeader() },
          body: JSON.stringify({ id, ...extra }),
        });
        if (!response.ok) throw new Error("Non foi posible actualizar a solicitude.");
      }

      async function handleDarDeAltaNoMapa(item, card, statusNote) {
        const centroResponse = await fetch(`/api/centro?codigo=${encodeURIComponent(item.centroCodigo)}`, {
          headers: { Authorization: xestionAuthHeader() },
        });
        if (!centroResponse.ok) throw new Error("Non se atopou o centro no catálogo de centros.");
        const { centro } = await centroResponse.json();

        if (centro.estado !== "activa") {
          statusNote.textContent = "Gardando en GitHub…";
          await engadirCentroAoMapa(centro);
        }
        statusNote.textContent = "Arquivando a solicitude…";
        await patchSolicitude(item.id, { estado: "arquivada", noMapa: true });
        item.estado = "arquivada";
        item.noMapa = true;
      }

      document.querySelector("#list").addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-state], button[data-action]");
        if (!button) return;
        const card = button.closest("article[data-id]");
        const id = card.dataset.id;
        const item = solicitudes.find((s) => s.id === id);
        if (!item) return;

        if (button.dataset.action === "mapa") {
          const confirmed = window.confirm(
            `Dar de alta "${item.centro}" no mapa coma asemblea activa?\n\nIsto fai un commit no repositorio (sen datos de contacto) e tarda un par de minutos en verse no mapa.`
          );
          if (!confirmed) return;
          card.querySelectorAll("button").forEach((btn) => (btn.disabled = true));
          const statusNote = document.createElement("p");
          statusNote.className = "status-note";
          statusNote.textContent = "Comprobando o centro…";
          card.appendChild(statusNote);
          try {
            await handleDarDeAltaNoMapa(item, card, statusNote);
            render();
          } catch (error) {
            statusNote.remove();
            card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
            alert(`Non foi posible dar de alta no mapa: ${error.message}`);
          }
          return;
        }

        card.querySelectorAll("button").forEach((btn) => (btn.disabled = true));
        try {
          await patchSolicitude(id, { estado: button.dataset.state });
          item.estado = button.dataset.state;
          render();
        } catch {
          card.querySelectorAll("button").forEach((btn) => (btn.disabled = false));
          alert("Non foi posible actualizar a solicitude. Téntao outra vez.");
        }
      });

      fetch("/api/solicitudes", { headers: { Authorization: xestionAuthHeader() } })
        .then((response) => {
          if (response.status === 401) sessionStorage.removeItem("aaep-xestion-password");
          if (!response.ok) throw new Error("Acceso non autorizado");
          return response.json();
        })
        .then(({ solicitudes: data }) => {
          solicitudes = data || [];
          render();
        })
        .catch((error) => {
          document.querySelector("#list").innerHTML = `<p class="status-msg error">${escapeHtml(error.message)}. Recarga a páxina para volver escribir o contrasinal.</p>`;
        });
    </script>
  </body>
</html>

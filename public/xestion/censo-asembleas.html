<!doctype html>
<html lang="gl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Censo de asembleas · Xestión AAEP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap");

      :root {
        --ink: #252321;
        --paper: #f2f0ec;
        --paper-raised: #fbfaf8;
        --red: #c94a42;
        --green: #355a2c;
        --green-bg: rgba(53, 90, 44, 0.1);
        --grey: #6f6c66;
        --grey-bg: rgba(111, 108, 102, 0.12);
        --line: rgba(37, 35, 33, 0.14);
        --line-strong: rgba(37, 35, 33, 0.28);
        --shadow: 3px 3px 0 rgba(37, 35, 33, 0.12);
        --font-display: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", sans-serif;
        --font-sans: Inter, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
      }
      .topbar {
        position: sticky; top: 0; z-index: 10;
        background: var(--paper); border-bottom: 1px solid var(--line);
      }
      .topbar-inner {
        max-width: 1200px; margin: 0 auto; padding: 18px 20px;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .badge {
        display: grid; place-items: center; width: 34px; height: 34px; border-radius: 4px;
        background: var(--ink); color: var(--paper); font-weight: 800; font-size: 0.7rem; flex-shrink: 0;
      }
      .topbar h1 { font-family: var(--font-display); font-stretch: condensed; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
      .topbar .links { margin-left: auto; display: flex; gap: 16px; align-items: center; font-size: 0.78rem; font-weight: 700; flex-wrap: wrap; }
      .topbar a { color: var(--ink); }
      .topbar button.link {
        appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink); opacity: 0.55; cursor: pointer;
      }
      .topbar button.link:hover { opacity: 1; text-decoration: underline; }

      .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 90px; }

      .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      .count-badge {
        display: inline-flex; align-items: baseline; gap: 6px;
        border: 1.5px solid var(--ink); border-radius: 4px; padding: 9px 16px;
        font-weight: 700; font-size: 0.82rem; background: var(--paper-raised);
      }
      .count-badge strong { font-size: 1.1rem; font-weight: 800; }

      .controls-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

      .search {
        flex: 1; min-width: 200px; max-width: 320px;
        border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 9px 12px;
        font: inherit; font-size: 0.85rem; background: var(--paper-raised); color: var(--ink);
      }
      .search:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

      button.export {
        appearance: none; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper);
        padding: 9px 16px; font: inherit; font-size: 0.82rem; font-weight: 700; border-radius: 4px; cursor: pointer;
      }
      button.export:hover { background: var(--red); border-color: var(--red); }
      button.export:disabled { opacity: 0.4; cursor: default; background: var(--paper-raised); color: var(--ink); }
      button.export.secondary { background: var(--paper-raised); color: var(--ink); }
      button.export.secondary:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

      .status-msg { padding: 40px 0; text-align: center; color: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 0.95rem; }
      .status-msg.error { color: var(--red); font-weight: 700; }

      .table-wrap {
        background: var(--paper-raised); border: 1px solid var(--line); border-radius: 5px;
        box-shadow: var(--shadow); overflow-x: auto;
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 800;
        color: color-mix(in srgb, var(--ink) 60%, transparent);
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: rgba(37, 35, 33, 0.03); }
      td a { color: var(--ink); font-weight: 600; }
      td.codigo { font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--ink) 55%, transparent); }
      td.contacto { white-space: normal; max-width: 260px; }
      .pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 4px 10px; border-radius: 999px;
      }
      .pill.activa { background: var(--green-bg); color: var(--green); }
      .pill.creacion { background: var(--grey-bg); color: var(--grey); }

      @media (max-width: 560px) {
        .controls { flex-direction: column; align-items: stretch; }
        .search { max-width: none; }
      }
      .xestion-shell { display: flex; align-items: flex-start; min-height: 100vh; }
      .xestion-sidebar { flex: 0 0 220px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--paper-raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; box-sizing: border-box; }
      .xestion-sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; text-decoration: none; }
      .xestion-sidebar-brand .brand-title { font-family: var(--font-display); font-stretch: condensed; font-size: 1.1rem; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
      .xestion-sidebar-top { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
      .xestion-sidebar-top .xestion-sidebar-brand { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
      .sidebar-toggle { flex-shrink: 0; appearance: none; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); width: 26px; height: 26px; border-radius: 4px; font-size: 0.8rem; line-height: 1; cursor: pointer; display: grid; place-items: center; }
      .sidebar-toggle:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      .nav-group { display: flex; flex-direction: column; }
      .nav-group-toggle { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; padding: 8px 2px 4px; margin-top: 10px; }
      .xestion-nav .nav-group:first-child .nav-group-toggle { margin-top: 0; }
      .nav-group-toggle .chev { font-size: 0.6rem; color: color-mix(in srgb, var(--ink) 45%, transparent); transition: transform 0.15s ease; }
      .nav-group-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
      .nav-group-body { display: flex; flex-direction: column; gap: 2px; }
      .nav-subgroup-label { margin: 10px 0 2px; padding: 0 10px; font-size: 0.72rem; font-weight: 700; color: color-mix(in srgb, var(--ink) 65%, transparent); }
      .nav-group-body .nav-subgroup-label:first-child { margin-top: 2px; }
      .xestion-nav { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
      .nav-group-label { margin: 18px 0 6px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: color-mix(in srgb, var(--ink) 50%, transparent); }
      .xestion-nav .nav-group-label:first-child { margin-top: 0; }
      .nav-link { display: block; padding: 8px 10px; border-radius: 4px; font-size: 0.86rem; font-weight: 600; color: var(--ink); text-decoration: none; }
      .nav-link:hover { background: rgba(37, 35, 33, 0.06); }
      .nav-link.current { background: var(--ink); color: var(--paper); font-weight: 700; }
      .xestion-sidebar { transition: flex-basis 0.15s ease, padding 0.15s ease; }
      .xestion-sidebar.collapsed { flex-basis: 48px; padding-left: 8px; padding-right: 8px; }
      .xestion-sidebar.collapsed .xestion-sidebar-brand,
      .xestion-sidebar.collapsed .xestion-nav,
      .xestion-sidebar.collapsed .xestion-sidebar-foot { display: none; }
      .xestion-sidebar.collapsed .xestion-sidebar-top { justify-content: center; }
      .xestion-sidebar-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 0.78rem; font-weight: 700; }
      .xestion-sidebar-foot a { color: var(--ink); }
      .xestion-sidebar-foot button.link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink); opacity: 0.55; cursor: pointer; text-align: left; }
      .xestion-sidebar-foot button.link:hover { opacity: 1; text-decoration: underline; }
      .xestion-main { flex: 1 1 auto; min-width: 0; }
      @media (max-width: 760px) {
        .xestion-shell { flex-direction: column; min-height: 0; }
        .xestion-sidebar { position: static; height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
        .xestion-sidebar-brand { margin-bottom: 0; margin-right: auto; }
        .sidebar-toggle { display: none; }
        .xestion-sidebar.collapsed { flex-basis: 100%; padding-left: 16px; padding-right: 16px; }
        .xestion-sidebar.collapsed .xestion-sidebar-brand,
        .xestion-sidebar.collapsed .xestion-nav,
        .xestion-sidebar.collapsed .xestion-sidebar-foot { display: flex; }
        .nav-group { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; }
        .nav-group-toggle { display: none; }
        .nav-group-body { display: flex !important; flex-direction: row; flex-wrap: wrap; gap: 6px; }
        .nav-subgroup-label { display: none; }
        .xestion-nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
        .nav-group-label { display: none; }
        .xestion-sidebar-foot { flex-direction: row; margin-top: 0; padding-top: 0; border-top: 0; margin-left: auto; }
      }
    </style>
  </head>
  <body>
    <div class="xestion-shell">
      <aside class="xestion-sidebar" id="xestion-sidebar">
        <div class="xestion-sidebar-top">
          <a class="xestion-sidebar-brand" href="/xestion/">
            <span class="badge">AA</span>
            <span class="brand-title">Xestión AAEP</span>
          </a>
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Pregar menú" title="Pregar menú">«</button>
        </div>
        <nav class="xestion-nav">
          <div class="nav-group" data-group="xeral">
            <button type="button" class="nav-group-toggle" aria-expanded="true">
              <span class="nav-group-label">Xeral</span>
              <span class="chev">▾</span>
            </button>
            <div class="nav-group-body">
              <a href="/xestion/calendario" class="nav-link">Calendario</a>
              <a href="/xestion/solicitudes" class="nav-link">Solicitudes</a>
            </div>
          </div>
          <div class="nav-group" data-group="coordinacion">
            <button type="button" class="nav-group-toggle" aria-expanded="true">
              <span class="nav-group-label">Coordinación</span>
              <span class="chev">▾</span>
            </button>
            <div class="nav-group-body">
              <a href="/xestion/coordinacion" class="nav-link">Mapa e territorios</a>
              <a href="/xestion/censo-asembleas" class="nav-link current">Censo de asembleas</a>
            </div>
          </div>
          <div class="nav-group" data-group="gdt">
            <button type="button" class="nav-group-toggle" aria-expanded="true">
              <span class="nav-group-label">Grupos de traballo</span>
              <span class="chev">▾</span>
            </button>
            <div class="nav-group-body">
              <p class="nav-subgroup-label">Comunicación</p>
              <a href="/xestion/stories" class="nav-link">Stories</a>
            </div>
          </div>
        </nav>
        <div class="xestion-sidebar-foot">
          <a href="/admin/">CMS (Decap) →</a>
          <button type="button" class="link" id="forget-password">Esquecer contrasinal</button>
        </div>
      </aside>
      <div class="xestion-main">
    <div class="topbar">
      <div class="topbar-inner">
        <span class="badge">AA</span>
        <h1>Censo de asembleas</h1>
        <div class="links">
          <a href="/admin/#/collections/configuracion/entries/asembleas">Xestionar asembleas →</a>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="controls">
        <div class="count-badge" id="count">Cargando…</div>
        <div class="controls-right">
          <input type="search" id="search" class="search" placeholder="Buscar por centro, concello ou contacto…" />
          <button type="button" class="export secondary" id="download-xlsx" disabled>Descargar XLSX</button>
          <button type="button" class="export" id="download-csv" disabled>Descargar CSV</button>
        </div>
      </div>

      <div id="content"><p class="status-msg">Cargando censo…</p></div>
    </div>

      </div>
    </div>

    <script src="/xestion/sidebar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script>
      const escapeHtml = (value = "") => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);

      const ESTADO_LABEL = { activa: "Activa", creacion: "En creación" };

      function xestionAuthHeader() {
        let password = sessionStorage.getItem("aaep-xestion-password");
        if (password === null) {
          password = window.prompt("Contrasinal de xestión:") || "";
          sessionStorage.setItem("aaep-xestion-password", password);
        }
        return "Basic " + btoa(":" + password);
      }

      document.querySelector("#forget-password").addEventListener("click", () => {
        sessionStorage.removeItem("aaep-xestion-password");
        location.reload();
      });

      let asembleas = [];
      let query = "";

      function render() {
        const normalizedQuery = query.toLocaleLowerCase("gl");
        const visible = asembleas.filter((item) => {
          if (!normalizedQuery) return true;
          const haystack = `${item.codigo} ${item.nome} ${item.concello} ${item.contacto || ""}`.toLocaleLowerCase("gl");
          return haystack.includes(normalizedQuery);
        });
        document.querySelector("#count").innerHTML = `<strong>${asembleas.length}</strong> ${asembleas.length === 1 ? "asemblea" : "asembleas"}`;

        const content = document.querySelector("#content");
        if (!asembleas.length) {
          content.innerHTML = `<p class="status-msg">Aínda non hai ningunha asemblea rexistrada.</p>`;
          return;
        }
        if (!visible.length) {
          content.innerHTML = `<p class="status-msg">Ningunha asemblea coincide coa busca.</p>`;
          return;
        }

        content.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Código</th><th>Centro</th><th>Concello</th><th>Estado</th><th>Contacto</th></tr></thead>
              <tbody>
                ${visible.map((item) => `
                  <tr>
                    <td class="codigo">${escapeHtml(item.codigo)}</td>
                    <td>${escapeHtml(item.nome)}</td>
                    <td>${escapeHtml(item.concello)}</td>
                    <td><span class="pill ${item.estado}">${ESTADO_LABEL[item.estado] || item.estado}</span></td>
                    <td class="contacto">${item.contacto ? escapeHtml(item.contacto) : "—"}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      document.querySelector("#search").addEventListener("input", (event) => {
        query = event.target.value.trim();
        render();
      });

      fetch("/api/asembleas", { headers: { Authorization: xestionAuthHeader() } })
        .then((response) => {
          if (response.status === 401) sessionStorage.removeItem("aaep-xestion-password");
          if (!response.ok) throw new Error("Acceso non autorizado");
          return response.json();
        })
        .then(({ asembleas: data }) => {
          asembleas = data || [];
          render();
          document.querySelector("#download-csv").disabled = !asembleas.length;
          document.querySelector("#download-xlsx").disabled = !asembleas.length;
        })
        .catch((error) => {
          document.querySelector("#count").textContent = "";
          document.querySelector("#content").innerHTML = `<p class="status-msg error">${escapeHtml(error.message)}. Recarga a páxina para volver escribir o contrasinal.</p>`;
        });

      function exportRows() {
        return asembleas.map((item) => ({
          codigo: item.codigo,
          nome: item.nome,
          concello: item.concello,
          estado: ESTADO_LABEL[item.estado] || item.estado,
          contacto: item.contacto || "",
        }));
      }

      document.querySelector("#download-csv").addEventListener("click", () => {
        const header = "codigo,nome,concello,estado,contacto\n";
        const escapeCsv = (value) => `"${String(value).replace(/"/g, '""')}"`;
        const body = exportRows()
          .map((row) => [row.codigo, row.nome, row.concello, row.estado, row.contacto].map(escapeCsv).join(","))
          .join("\n");
        const blob = new Blob([header + body], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `censo-asembleas-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      document.querySelector("#download-xlsx").addEventListener("click", () => {
        if (typeof XLSX === "undefined") {
          window.alert("Non foi posible cargar a libraría de Excel. Comproba a conexión e vólveo intentar.");
          return;
        }
        const sheet = XLSX.utils.json_to_sheet(exportRows(), {
          header: ["codigo", "nome", "concello", "estado", "contacto"],
        });
        XLSX.utils.sheet_add_aoa(sheet, [["Código", "Centro", "Concello", "Estado", "Contacto"]], { origin: "A1" });
        sheet["!cols"] = [{ wch: 12 }, { wch: 38 }, { wch: 20 }, { wch: 12 }, { wch: 28 }];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, sheet, "Asembleas");
        XLSX.writeFile(workbook, `censo-asembleas-${new Date().toISOString().slice(0, 10)}.xlsx`);
      });
    </script>
  </body>
</html>

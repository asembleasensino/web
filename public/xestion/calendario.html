<!doctype html>
<html lang="gl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendario · Xestión AAEP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

      :root {
        --ink: #252321;
        --paper: #f2f0ec;
        --paper-raised: #fbfaf8;
        --red: #c94a42;
        --red-bg: rgba(201, 74, 66, 0.1);
        --green: #355a2c;
        --green-bg: rgba(53, 90, 44, 0.1);
        --amber: #a8722a;
        --amber-bg: rgba(184, 134, 46, 0.14);
        --line: rgba(37, 35, 33, 0.14);
        --line-strong: rgba(37, 35, 33, 0.28);
        --shadow: 3px 3px 0 rgba(37, 35, 33, 0.12);
        --font-display: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", sans-serif;
        --font-sans: Inter, "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink); line-height: 1.5; display: flex; flex-direction: row; }

      .page { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

      /* ---- Sidebar (mesmo patrón que o resto de /xestion) ---- */
      .xestion-sidebar { flex: 0 0 220px; height: 100%; overflow-y: auto; background: var(--paper-raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; box-sizing: border-box; transition: flex-basis 0.15s ease, padding 0.15s ease; }
      .xestion-sidebar-top { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
      .xestion-sidebar-top .xestion-sidebar-brand { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
      .xestion-sidebar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
      .xestion-sidebar-brand .brand-title { font-family: var(--font-display); font-stretch: condensed; font-size: 1.1rem; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
      .badge { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 4px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 0.7rem; flex-shrink: 0; }
      .sidebar-toggle { flex-shrink: 0; appearance: none; border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); width: 26px; height: 26px; border-radius: 4px; font-size: 0.8rem; line-height: 1; cursor: pointer; display: grid; place-items: center; }
      .sidebar-toggle:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
      .xestion-nav { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
      .nav-group { display: flex; flex-direction: column; }
      .nav-group-toggle { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; padding: 8px 2px 4px; margin-top: 10px; }
      .xestion-nav .nav-group:first-child .nav-group-toggle { margin-top: 0; }
      .nav-group-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: color-mix(in srgb, var(--ink) 50%, transparent); }
      .nav-group-toggle .chev { font-size: 0.6rem; color: color-mix(in srgb, var(--ink) 45%, transparent); transition: transform 0.15s ease; }
      .nav-group-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
      .nav-group-body { display: flex; flex-direction: column; gap: 2px; }
      .nav-subgroup-label { margin: 10px 0 2px; padding: 0 10px; font-size: 0.72rem; font-weight: 700; color: color-mix(in srgb, var(--ink) 65%, transparent); }
      .nav-group-body .nav-subgroup-label:first-child { margin-top: 2px; }
      .nav-link { display: block; padding: 8px 10px; border-radius: 4px; font-size: 0.86rem; font-weight: 600; color: var(--ink); text-decoration: none; }
      .nav-link:hover { background: rgba(37, 35, 33, 0.06); }
      .nav-link.current { background: var(--ink); color: var(--paper); font-weight: 700; }
      .xestion-sidebar-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 0.78rem; font-weight: 700; }
      .xestion-sidebar-foot a { color: var(--ink); }
      .xestion-sidebar-foot button.link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--ink); opacity: 0.55; cursor: pointer; text-align: left; }
      .xestion-sidebar-foot button.link:hover { opacity: 1; text-decoration: underline; }
      .xestion-sidebar.collapsed { flex-basis: 48px; padding-left: 8px; padding-right: 8px; }
      .xestion-sidebar.collapsed .xestion-sidebar-brand,
      .xestion-sidebar.collapsed .xestion-nav,
      .xestion-sidebar.collapsed .xestion-sidebar-foot { display: none; }
      .xestion-sidebar.collapsed .xestion-sidebar-top { justify-content: center; }

      @media (max-width: 760px) {
        body { flex-direction: column; height: auto; }
        .xestion-sidebar { height: auto; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
        .xestion-sidebar-brand { margin-bottom: 0; margin-right: auto; }
        .sidebar-toggle { display: none; }
        .xestion-sidebar.collapsed { flex-basis: 100%; padding-left: 16px; padding-right: 16px; }
        .xestion-sidebar.collapsed .xestion-sidebar-brand,
        .xestion-sidebar.collapsed .xestion-nav,
        .xestion-sidebar.collapsed .xestion-sidebar-foot { display: flex; }
        .xestion-nav { flex-direction: row; flex-wrap: wrap; gap: 6px; }
        .nav-group { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; }
        .nav-group-toggle { display: none; }
        .nav-group-body { display: flex !important; flex-direction: row; flex-wrap: wrap; gap: 6px; }
        .nav-subgroup-label { display: none; }
        .xestion-sidebar-foot { flex-direction: row; margin-top: 0; padding-top: 0; border-top: 0; margin-left: auto; }
        .page { height: auto; }
      }

      /* ---- Topbar ---- */
      .topbar { flex: 0 0 auto; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 20; }
      .topbar-inner { padding: 16px 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
      .topbar h1 { font-family: var(--font-display); font-stretch: condensed; font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
      .topbar .subtitle { font-size: 0.82rem; color: color-mix(in srgb, var(--ink) 55%, transparent); }

      .search, select, input[type="text"], input[type="search"], input[type="datetime-local"], input[type="date"], textarea {
        border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 9px 11px;
        font: inherit; font-size: 0.85rem; background: var(--paper-raised); color: var(--ink);
      }
      select:focus, input:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

      /* ---- Layout: grade + aside ---- */
      .cal-layout { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
      @media (max-width: 960px) { .cal-layout { grid-template-columns: 1fr; } }

      .cal-main { padding: 20px 24px 40px; overflow-y: auto; min-width: 0; }

      .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
      .cal-month-nav { display: flex; align-items: center; gap: 10px; }
      .cal-month-nav button { appearance: none; border: 1.5px solid var(--ink); background: var(--paper-raised); color: var(--ink); width: 32px; height: 32px; border-radius: 4px; font-size: 0.95rem; cursor: pointer; }
      .cal-month-nav button:hover { background: var(--ink); color: var(--paper); }
      .cal-month-nav h2 { margin: 0; font-family: var(--font-display); font-stretch: condensed; font-size: 1.3rem; min-width: 190px; text-align: center; text-transform: capitalize; }
      .cal-today-btn { appearance: none; border: 1.5px solid var(--line-strong); background: var(--paper-raised); color: var(--ink); padding: 7px 14px; font: inherit; font-size: 0.78rem; font-weight: 700; border-radius: 4px; cursor: pointer; }
      .cal-today-btn:hover { border-color: var(--ink); }

      .cal-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .cal-filters select { min-width: 140px; }

      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--line); gap: 1px; }
      .cal-dow { background: var(--paper-raised); padding: 8px 10px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: color-mix(in srgb, var(--ink) 55%, transparent); text-align: center; }
      .cal-day { background: var(--paper-raised); min-height: 92px; padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
      .cal-day:hover { background: color-mix(in srgb, var(--paper-raised) 85%, var(--ink) 4%); }
      .cal-day.outside { background: color-mix(in srgb, var(--paper-raised) 92%, var(--paper) 40%); opacity: 0.55; }
      .cal-day.selected { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 1; }
      .cal-day-num { font-size: 0.78rem; font-weight: 700; }
      .cal-day.today .cal-day-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: var(--paper); }
      .cal-chips { display: flex; flex-direction: column; gap: 3px; }
      .cal-chip { font-size: 0.66rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cal-chip.grupo-coordinacion { background: var(--green-bg); color: var(--green); }
      .cal-chip.grupo-comunicacion { background: var(--amber-bg); color: var(--amber); }
      .cal-chip.tipo-prazo { border-left: 3px solid var(--red); padding-left: 4px; }
      .cal-chip.estado-feita { opacity: 0.5; text-decoration: line-through; }
      .cal-more { font-size: 0.64rem; font-weight: 700; color: color-mix(in srgb, var(--ink) 55%, transparent); }

      .cal-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 0.74rem; font-weight: 600; color: color-mix(in srgb, var(--ink) 65%, transparent); }
      .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .cal-legend i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
      .cal-legend i.coordinacion { background: var(--green); }
      .cal-legend i.comunicacion { background: var(--amber); }
      .cal-legend i.prazo { background: var(--red); }

      /* ---- Aside ---- */
      .cal-aside { border-left: 1px solid var(--line); padding: 20px 20px 60px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
      @media (max-width: 960px) { .cal-aside { border-left: 0; border-top: 1px solid var(--line); } }

      .section-label { margin: 0 0 10px; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: color-mix(in srgb, var(--ink) 55%, transparent); }
      .status-msg { padding: 24px 0; text-align: center; color: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 0.88rem; }
      .status-msg.error { color: var(--red); font-weight: 700; }
      .empty-state { margin: 0; padding: 16px 14px; border: 1.5px dashed var(--line-strong); border-radius: 5px; font-size: 0.8rem; text-align: center; color: color-mix(in srgb, var(--ink) 55%, transparent); }

      .btn { appearance: none; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 8px 14px; font: inherit; font-size: 0.78rem; font-weight: 700; border-radius: 4px; cursor: pointer; }
      .btn:hover { background: var(--ink); color: var(--paper); }
      .btn.primary { background: var(--ink); color: var(--paper); }
      .btn.primary:hover { background: var(--green); border-color: var(--green); }
      .btn.danger { border-color: var(--red); color: var(--red); }
      .btn.danger:hover { background: var(--red); color: var(--paper); }
      .btn.block { width: 100%; justify-content: center; display: flex; }

      .upcoming-list { display: grid; gap: 10px; }
      .upcoming-item { all: unset; display: block; text-align: left; cursor: pointer; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; }
      .upcoming-item:hover { border-color: var(--line-strong); }
      .upcoming-item .u-date { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
      .upcoming-item.grupo-coordinacion .u-date { color: var(--green); }
      .upcoming-item.grupo-comunicacion .u-date { color: var(--amber); }
      .upcoming-item .u-title { font-size: 0.86rem; font-weight: 700; margin-top: 2px; }
      .upcoming-item .u-meta { font-size: 0.72rem; color: color-mix(in srgb, var(--ink) 55%, transparent); margin-top: 2px; }

      .ev-detail { display: grid; gap: 12px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 18px; }
      .ev-detail h3 { margin: 0; font-size: 1.05rem; font-weight: 800; }
      .ev-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 999px; width: fit-content; }
      .ev-pill.grupo-coordinacion { background: var(--green-bg); color: var(--green); }
      .ev-pill.grupo-comunicacion { background: var(--amber-bg); color: var(--amber); }
      .ev-field { font-size: 0.82rem; }
      .ev-field b { display: block; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: color-mix(in srgb, var(--ink) 50%, transparent); margin-bottom: 2px; }
      .ev-field a { color: var(--ink); font-weight: 700; }
      .ev-actions { display: flex; flex-wrap: wrap; gap: 8px; }

      .form-grid { display: grid; gap: 10px; }
      .form-grid label { display: grid; gap: 4px; font-size: 0.7rem; font-weight: 700; color: color-mix(in srgb, var(--ink) 65%, transparent); }
      .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .form-grid textarea { min-height: 56px; resize: vertical; font-family: inherit; }
      .form-note { margin: 0; font-size: 0.76rem; font-weight: 700; min-height: 1em; }
      .form-note.error { color: var(--red); }
      .form-note.ok { color: var(--green); }
    </style>
  </head>
  <body>
    <aside class="xestion-sidebar" id="xestion-sidebar">
      <div class="xestion-sidebar-top">
        <a class="xestion-sidebar-brand" href="/xestion/">
          <span class="badge">AA</span>
          <span class="brand-title">Xestión AAEP</span>
        </a>
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Pregar menú" title="Pregar menú">«</button>
      </div>
      <nav class="xestion-nav">
        <div class="nav-group" data-group="xeral">
          <button type="button" class="nav-group-toggle" aria-expanded="true">
            <span class="nav-group-label">Xeral</span>
            <span class="chev">▾</span>
          </button>
          <div class="nav-group-body">
            <a href="/xestion/calendario" class="nav-link current">Calendario</a>
            <a href="/xestion/solicitudes" class="nav-link">Solicitudes</a>
          </div>
        </div>
        <div class="nav-group" data-group="coordinacion">
          <button type="button" class="nav-group-toggle" aria-expanded="true">
            <span class="nav-group-label">Coordinación</span>
            <span class="chev">▾</span>
          </button>
          <div class="nav-group-body">
            <a href="/xestion/coordinacion" class="nav-link">Mapa e territorios</a>
            <a href="/xestion/censo-asembleas" class="nav-link">Censo de asembleas</a>
          </div>
        </div>
        <div class="nav-group" data-group="gdt">
          <button type="button" class="nav-group-toggle" aria-expanded="true">
            <span class="nav-group-label">Grupos de traballo</span>
            <span class="chev">▾</span>
          </button>
          <div class="nav-group-body">
            <p class="nav-subgroup-label">Comunicación</p>
            <a href="/xestion/stories" class="nav-link">Stories</a>
          </div>
        </div>
      </nav>
      <div class="xestion-sidebar-foot">
        <a href="/admin/">CMS (Decap) →</a>
        <button type="button" class="link" id="forget-password">Esquecer contrasinal</button>
      </div>
    </aside>

    <div class="page">
      <div class="topbar">
        <div class="topbar-inner">
          <h1>Calendario</h1>
          <span class="subtitle">Prazos, reunións e tarefas de Coordinación e dos GdT, nun só sitio.</span>
        </div>
      </div>

      <div class="cal-layout">
        <div class="cal-main">
          <div class="cal-toolbar">
            <div class="cal-month-nav">
              <button type="button" id="mes-anterior" aria-label="Mes anterior">‹</button>
              <h2 id="mes-actual"></h2>
              <button type="button" id="mes-seguinte" aria-label="Mes seguinte">›</button>
            </div>
            <button type="button" class="cal-today-btn" id="ir-a-hoxe">Hoxe</button>
            <div class="cal-filters">
              <select id="filtro-grupo" aria-label="Filtrar por grupo">
                <option value="">Todos os grupos</option>
                <option value="coordinacion">Coordinación</option>
                <option value="comunicacion">Comunicación</option>
              </select>
              <select id="filtro-zona" aria-label="Filtrar por zona"><option value="">Todas as zonas</option></select>
              <select id="filtro-tipo" aria-label="Filtrar por tipo">
                <option value="">Todos os tipos</option>
                <option value="reunion">Reunións</option>
                <option value="prazo">Prazos</option>
                <option value="tarefa">Tarefas</option>
              </select>
            </div>
          </div>

          <div id="cal-grid-wrap"><p class="status-msg">Cargando calendario…</p></div>

          <div class="cal-legend">
            <span><i class="coordinacion"></i> Coordinación</span>
            <span><i class="comunicacion"></i> Comunicación</span>
            <span><i class="prazo"></i> Prazo (bordo esquerdo)</span>
          </div>
        </div>

        <aside class="cal-aside">
          <div>
            <button type="button" class="btn primary block" id="novo-evento-btn">+ Novo evento</button>
          </div>
          <div id="aside-content">
            <p class="section-label">Próximos</p>
            <div id="upcoming-list"><p class="status-msg">Cargando…</p></div>
          </div>
        </aside>
      </div>
    </div>

    <script src="/xestion/sidebar.js"></script>
    <script src="/xestion/calendario.js"></script>
  </body>
</html>
